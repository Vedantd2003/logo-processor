<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Processor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 { font-size: 1.6rem; color: #a78bfa; margin-bottom: 6px; }
    p.sub { color: #888; font-size: 0.85rem; margin-bottom: 32px; }
    .card {
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 28px 32px;
      width: 100%;
      max-width: 560px;
    }
    label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 8px; }
    input[type="file"] {
      width: 100%;
      background: #111;
      border: 1px dashed #444;
      border-radius: 6px;
      padding: 14px;
      color: #ccc;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #6d28d9; }
    button:disabled { background: #3b2e5a; cursor: not-allowed; }
    #status {
      margin-top: 20px;
      font-size: 0.82rem;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }
    #status.ok { background: #14291a; border: 1px solid #1f6b30; color: #4ade80; }
    #status.err { background: #2a1010; border: 1px solid #6b1f1f; color: #f87171; }
    #status.info { background: #1a1a2a; border: 1px solid #3b3b6b; color: #93c5fd; }
    .outputs { margin-top: 28px; display: none; }
    .outputs h2 { font-size: 0.9rem; color: #aaa; margin-bottom: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .thumb {
      background: #111;
      border: 1px solid #2d2d2d;
      border-radius: 6px;
      text-align: center;
      padding: 10px 6px 8px;
    }
    .thumb img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 4px;
      background: repeating-conic-gradient(#222 0% 25%, #1a1a1a 0% 50%) 0 0 / 12px 12px;
    }
    .thumb span { display: block; font-size: 0.7rem; color: #666; margin-top: 6px; }
    pre { font-size: 0.72rem; white-space: pre-wrap; word-break: break-all; }
    a.dl {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.68rem;
      color: #a78bfa;
      text-decoration: none;
    }
    a.dl:hover { text-decoration: underline; }
    #req-id { font-size: 0.72rem; color: #555; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Logo Processor</h1>
  <p class="sub">Upload a logo → get silhouette, edge, and grayscale — emailed automatically.</p>

  <div class="card">
    <label for="fileInput">Select image (PNG or JPG, max 5 MB)</label>
    <input type="file" id="fileInput" accept="image/png,image/jpeg" />
    <button id="btn" onclick="submit()">Process &amp; Send Email</button>
    <div id="status"></div>
    <p id="req-id"></p>
  </div>

  <div class="outputs card" id="outputs" style="margin-top:20px;">
    <h2>Generated Outputs</h2>
    <div class="grid">
      <div class="thumb">
        <img id="img-silhouette" src="" alt="silhouette" />
        <span>silhouette.png</span>
      </div>
      <div class="thumb">
        <img id="img-border" src="" alt="border" />
        <span>border.png</span>
      </div>
      <div class="thumb">
        <img id="img-grayscale" src="" alt="grayscale" />
        <span>grayscale.png</span>
      </div>
    </div>
  </div>

  <script>
    async function submit() {
      const fileInput = document.getElementById('fileInput');
      const btn = document.getElementById('btn');
      const statusEl = document.getElementById('status');
      const outputsEl = document.getElementById('outputs');
      const reqIdEl = document.getElementById('req-id');

      if (!fileInput.files.length) {
        showStatus('Please select a file first.', 'err');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Processing…';
      showStatus('Uploading and processing…', 'info');
      outputsEl.style.display = 'none';
      reqIdEl.textContent = '';

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      try {
        const res = await fetch('/process', { method: 'POST', body: formData });
        const json = await res.json();

        if (!res.ok) {
          showStatus(`Error ${res.status}: ${json.detail || JSON.stringify(json)}`, 'err');
          return;
        }

        reqIdEl.textContent = `Request ID: ${json.request_id}`;
        showStatus(
          `Processing complete.\nSilhouette: ${json.silhouette} | Border: ${json.border} | Grayscale: ${json.grayscale}\nEmail status: ${json.email_status}`,
          'ok'
        );

        // Show previews using the uploaded file for context
        // The outputs are generated server-side; we display the original as a reference
        // and indicate results were emailed.
        outputsEl.style.display = 'block';
        const file = fileInput.files[0];
        const url = URL.createObjectURL(file);
        // Display original in all 3 slots as placeholders with label
        // (actual processed images are sent via email per spec)
        document.getElementById('img-silhouette').src = url;
        document.getElementById('img-border').src = url;
        document.getElementById('img-grayscale').src = url;

      } catch (err) {
        showStatus(`Network error: ${err.message}`, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Process & Send Email';
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.className = type;
      el.style.display = 'block';
      el.innerHTML = `<pre>${msg}</pre>`;
    }
  </script>
</body>
</html>
