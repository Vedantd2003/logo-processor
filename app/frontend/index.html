<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Processor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 { font-size: 1.6rem; color: #a78bfa; margin-bottom: 6px; }
    p.sub { color: #888; font-size: 0.85rem; margin-bottom: 32px; }
    .card {
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 28px 32px;
      width: 100%;
      max-width: 560px;
    }
    label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 6px; }
    small { display: block; font-size: 0.72rem; color: #555; margin-bottom: 14px; }
    input[type="email"],
    input[type="file"] {
      width: 100%;
      background: #111;
      border: 1px dashed #444;
      border-radius: 6px;
      padding: 12px 14px;
      color: #ccc;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 4px;
    }
    input[type="email"] { cursor: text; margin-bottom: 4px; }
    input[type="email"]:focus { outline: none; border-color: #7c3aed; }
    button {
      width: 100%;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 16px;
    }
    button:hover:not(:disabled) { background: #6d28d9; }
    button:disabled { background: #3b2e5a; cursor: not-allowed; opacity: 0.6; }
    #status {
      margin-top: 20px;
      font-size: 0.82rem;
      padding: 12px 14px;
      border-radius: 6px;
      display: none;
      line-height: 1.6;
    }
    #status.ok     { background: #14291a; border: 1px solid #1f6b30; color: #4ade80; }
    #status.warn   { background: #292310; border: 1px solid #6b5a1f; color: #fbbf24; }
    #status.err    { background: #2a1010; border: 1px solid #6b1f1f; color: #f87171; }
    #status.info   { background: #1a1a2a; border: 1px solid #3b3b6b; color: #93c5fd; }
    #req-id { font-size: 0.7rem; color: #444; margin-top: 10px; }
    .outputs { margin-top: 28px; display: none; }
    .outputs h2 { font-size: 0.9rem; color: #aaa; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .thumb {
      background: #111;
      border: 1px solid #2d2d2d;
      border-radius: 6px;
      text-align: center;
      padding: 10px 6px 8px;
    }
    .thumb img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 4px;
      background: repeating-conic-gradient(#222 0% 25%, #1a1a1a 0% 50%) 0 0 / 12px 12px;
    }
    .thumb span { display: block; font-size: 0.7rem; color: #666; margin-top: 6px; }
    .thumb a { display: inline-block; margin-top: 4px; font-size: 0.68rem; color: #a78bfa; text-decoration: none; }
    .thumb a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Logo Processor</h1>
  <p class="sub">Upload a logo &rarr; get silhouette, edge, and grayscale &mdash; emailed automatically.</p>

  <div class="card">
    <label for="recipientEmail">Send processed images to:</label>
    <input type="email" id="recipientEmail" placeholder="your@email.com" required />
    <small>We'll email your 3 processed images to this address.</small>

    <label for="fileInput">Select image (PNG or JPG, max 5 MB):</label>
    <input type="file" id="fileInput" accept="image/png,image/jpeg" />

    <button id="btn" disabled onclick="submit()">Process &amp; Send Email</button>
    <div id="status"></div>
    <p id="req-id"></p>
  </div>

  <div class="outputs card" id="outputs" style="margin-top:20px;">
    <h2>Generated Outputs</h2>
    <div class="grid">
      <div class="thumb">
        <img id="img-silhouette" src="" alt="silhouette" />
        <span>silhouette.png</span>
        <a id="dl-silhouette" href="#" download="silhouette.png">download</a>
      </div>
      <div class="thumb">
        <img id="img-border" src="" alt="border" />
        <span>border.png</span>
        <a id="dl-border" href="#" download="border.png">download</a>
      </div>
      <div class="thumb">
        <img id="img-grayscale" src="" alt="grayscale" />
        <span>grayscale.png</span>
        <a id="dl-grayscale" href="#" download="grayscale.png">download</a>
      </div>
    </div>
  </div>

  <script>
    const emailEl   = document.getElementById('recipientEmail');
    const fileEl    = document.getElementById('fileInput');
    const btn       = document.getElementById('btn');

    function checkReady() {
      btn.disabled = !(emailEl.checkValidity() && fileEl.files.length > 0);
    }
    emailEl.addEventListener('input', checkReady);
    fileEl.addEventListener('change', checkReady);

    async function submit() {
      const outputsEl = document.getElementById('outputs');
      const reqIdEl   = document.getElementById('req-id');

      btn.disabled = true;
      btn.textContent = 'Processing...';
      showStatus('Uploading and processing — this may take a few seconds...', 'info');
      outputsEl.style.display = 'none';
      reqIdEl.textContent = '';

      const formData = new FormData();
      formData.append('recipient_email', emailEl.value.trim());
      formData.append('file', fileEl.files[0]);

      try {
        const res  = await fetch('/process', { method: 'POST', body: formData });
        const json = await res.json();

        if (!res.ok) {
          showStatus('Error ' + res.status + ': ' + (json.detail || 'Unknown error.'), 'err');
          return;
        }

        reqIdEl.textContent = 'Request ID: ' + json.request_id;

        if (json.email_status === 'sent') {
          const sentTo = json.sent_to || emailEl.value;
          showStatus(
            'Processing complete.\n'
            + 'Silhouette: ' + json.silhouette
            + ' | Border: '  + json.border
            + ' | Grayscale: '+ json.grayscale + '\n'
            + 'Sent to: ' + sentTo,
            'ok'
          );
        } else {
          // Processing worked but email failed — amber, no stack trace exposed
          console.error('Email failure detail (server logged):', json);
          showStatus(
            'Processing complete.\n'
            + 'Silhouette: ' + json.silhouette
            + ' | Border: '  + json.border
            + ' | Grayscale: '+ json.grayscale + '\n'
            + 'Email could not be sent. Please contact the site owner.',
            'warn'
          );
        }

        if (json.images && Object.keys(json.images).length > 0) {
          for (const name of ['silhouette', 'border', 'grayscale']) {
            const b64 = json.images[name];
            if (!b64) continue;
            const src = 'data:image/png;base64,' + b64;
            document.getElementById('img-' + name).src = src;
            const dl = document.getElementById('dl-' + name);
            dl.href = src;
          }
          outputsEl.style.display = 'block';
        }

      } catch (err) {
        console.error(err);
        showStatus('Network error — please try again.', 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Process & Send Email';
        checkReady();
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.className = type;
      el.style.display = 'block';
      el.textContent = msg;
    }
  </script>
</body>
</html>
